repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3   # keep in step with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]   # blocks accidental image, patch or checkpoint commits
        exclude: ^uv\.lock$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
